<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Status</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 450px; margin: 60px auto; text-align: center; }
        .card { border: 1px solid #ddd; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .success { color: #198754; }
        .error { color: #dc3545; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; color: #0d6efd; }
    </style>
</head>
<body>
    <div class="card">
        {% if success %}
            <h2 class="success">Prompt Sent to Your Phone</h2>
            <p>{{ message }}</p>
            <p><strong>Phone:</strong> {{ phone }}<br><strong>Amount:</strong> KES {{ amount }}</p>
            <p>Please enter your M-Pesa PIN on your handset to complete the payment.</p>
        {% else %}
            <h2 class="error">Payment Request Failed</h2>
            <p>{{ message }}</p>
        {% endif %}
        <a href="{% url 'home' %}">&larr; Make Another Payment</a>
    </div>
</body>
</html>
